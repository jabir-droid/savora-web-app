    // BAHASA TRANSLATOR ENGINE (CRITICAL BUG FIX)
    function applyLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('savora_lang', lang);
        var pack = languagePacks[lang];
        if (!pack) return;

        document.querySelectorAll('[data-translate]').forEach(function (el) {
            var key = el.getAttribute('data-translate');
            if (pack[key]) el.innerText = pack[key];
        });

        document.querySelectorAll('[data-placeholder-translate]').forEach(function (el) {
            var key = el.getAttribute('data-placeholder-translate');
            if (pack[key]) el.setAttribute('placeholder', pack[key]);
        });

        var indicator = document.getElementById('langIndicator');
        var desktopLabel = document.getElementById('langDesktopLabel');

        if (indicator) indicator.innerText = lang.toUpperCase();
        if (desktopLabel) desktopLabel.innerText = lang === 'id' ? "Bahasa: Indonesia" : "Language: English";
    }

    function toggleLang() {

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
            try {
                navigator.vibrate(pattern);
            } catch (e) { }
        }
    }

    // UX PERFORMANCE MONITOR (REAL-TIME CONSOLE TRACKER)
    function initFrameRenderMonitor() {
        var lastTime = performance.now();
        var frameCount = 0;
        var totalRenderTime = 0;

        function monitorLoop(currentTime) {
            var renderTime = currentTime - lastTime;
            lastTime = currentTime;
            frameCount++;
            totalRenderTime += renderTime;

            if (frameCount >= 180) {
                var avgFrameTime = (totalRenderTime / frameCount).toFixed(2);
                var fps = Math.round(1000 / (totalRenderTime / frameCount));
                var status = "🟢 Lancar (Optimis)";
                var cssColor = "color: #10b981;";

                if (avgFrameTime > 24) {
                    status = "🔴 Lag Signifikan Terdeteksi!";
                    cssColor = "color: #ef4444; font-weight: bolder;";
                } else if (avgFrameTime > 16.67) {
                    status = "🟡 Agak Lambat (Frame Drop)";
                    cssColor = "color: #f59e0b; font-weight: bold;";
                }

                console.log(
                    "[SAVORA PERFORMANCE] Avg Frame Time: " + avgFrameTime + "ms | Est. FPS: " + fps + " | Status: " + status,
                    cssColor + " font-family: monospace; font-size: 10.5px;"
                );

                frameCount = 0;
                totalRenderTime = 0;
            }
            requestAnimationFrame(monitorLoop);
        }
        requestAnimationFrame(monitorLoop);
    }

    // JAM DENGAN TRANSISI
    function updateClock() {
        var clockDesktop = document.getElementById('liveClock');
        var clockMobile = document.getElementById('liveClockMobile');
        var now = new Date();
        var hours = String(now.getHours()).padStart(2, '0');
        var minutes = String(now.getMinutes()).padStart(2, '0');
        var seconds = String(now.getSeconds()).padStart(2, '0');
        var formattedTime = hours + ":" + minutes + ":" + seconds;
        var timeString = '<i class="fa-solid fa-clock mr-1 text-savora-orange animate-pulse"></i> ' + formattedTime;
        if (clockDesktop) clockDesktop.innerHTML = timeString;
        if (clockMobile) clockMobile.innerHTML = timeString;
    }

    // OFFLINE & ONLINE DETECTOR
    function initOfflineSyncMonitor() {
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
    }

    function updateOnlineStatus() {
        var syncBox = document.getElementById('syncStatusBox');
        var syncDot = document.getElementById('syncStatusDot');
        var syncTitle = document.getElementById('syncStatus');
        var syncDesc = document.getElementById('syncStatusDesc');

        if (!syncBox || !syncTitle || !syncDesc) return;

        if (navigator.onLine) {
            syncBox.className = "bg-emerald-500/10 p-4 rounded-xl border border-emerald-500/20 text-xs transition-all duration-300";
            if (syncDot) syncDot.className = "w-2.5 h-2.5 bg-emerald-50 rounded-full flex items-center justify-center shrink-0";
            syncTitle.className = "font-semibold text-emerald-400";
            syncTitle.innerText = "Mode Online";
            syncDesc.innerText = "Tersinkronisasi otomatis dengan Cloud Aman.";
            processPendingOfflineSync();
        } else {
            syncBox.className = "bg-rose-500/10 p-4 rounded-xl border border-rose-500/20 text-xs transition-all duration-300 animate-pulse";
            if (syncDot) syncDot.className = "w-2.5 h-2.5 bg-rose-50 rounded-full flex items-center justify-center shrink-0";
            syncTitle.className = "font-semibold text-rose-400";
            syncTitle.innerText = "Offline (Penyimpanan Lokal)";
            syncDesc.innerText = "Koneksi terputus. Data baru disimpan aman di browser Anda.";
            showToast("Koneksi Terputus", "Savora beralih ke mode aman offline. Data Anda tetap tercatat.", "warning");
        }
    }

    function processPendingOfflineSync() {
        var queue = JSON.parse(localStorage.getItem('savora_pending_transactions')) || [];
        if (queue.length === 0) return;

        showToast("Sinkronisasi Data...", "Mengunggah " + queue.length + " transaksi offline ke Sheets.", "info");

        function uploadNext() {
            if (queue.length === 0) {
                localStorage.setItem('savora_pending_transactions', JSON.stringify([]));
                showToast("Sinkronisasi Berhasil", "Seluruh transaksi offline berhasil disinkronkan ke Sheets!", "success");
                loadAllDataFromGAS(localStorage.getItem('savora_active_tab') || 'dashboard');
                return;
            }

            var payload = queue.shift();
            if (checkIsGAS()) {
                google.script.run
                    .withSuccessHandler(function () { uploadNext(); })
                    .withFailureHandler(function () {
                        localStorage.setItem('savora_pending_transactions', JSON.stringify([payload].concat(queue)));
                    })
                    .addTransaction(payload);
            } else {
                uploadNext();
            }
        }
        uploadNext();
    }

    // FUNGSI SECURITY & PIN SCREEN
    function pressPin(num) {
        triggerHaptic(30);
        if (pinEntered.length < 4) {
            pinEntered += num;
            var b = document.getElementById("bullet-" + pinEntered.length);
            if (b) {
                b.classList.remove('border-slate-400/80');
                b.classList.add('bg-savora-orange', 'border-savora-orange', 'scale-110');
            }

            if (pinEntered.length === 4) {
                setTimeout(function () {
                    if (pinEntered === pinCode) {
                        if (isResetPinVerification) {
                            isResetPinVerification = false;
                            pinEntered = "";
                            for (var i = 1; i <= 4; i++) {
                                var bulletEl = document.getElementById("bullet-" + i);
                                if (bulletEl) bulletEl.className = "w-4 h-4 rounded-full border-2 border-slate-400/80 transition-all duration-200";
                            }
                            var screen = document.getElementById('pinScreen');
                            if (screen) {
                                screen.classList.add('opacity-0');
                                setTimeout(function () {
                                    screen.style.display = 'none';
                                    var pinInstructions = document.getElementById('pinInstructions');
                                    if (pinInstructions) {
                                        pinInstructions.innerText = "Masukkan kode PIN keamanan Anda untuk mengakses Savora";
                                    }
                                    var btnClearEl = document.getElementById('pinBtnClear');
                                    if (btnClearEl) btnClearEl.innerText = "HAPUS";
                                }, 300);
                            }
                            showActualFactoryResetConfirmation();
                        } else {
                            showToast("Sukses", "Akses Savora Berhasil Dibuka!", "success");
                            var screen = document.getElementById('pinScreen');
                            if (screen) {
                                screen.classList.add('opacity-0');
                                setTimeout(function () { screen.style.display = 'none'; }, 300);
                            }
                        }
                    } else {
                        showToast("Akses Ditolak", "Kode PIN Keamanan Salah!", "error");
                        clearPin();
                    }
                }, 180);
            }
        }
    }

    function clearPin() {
        if (isResetPinVerification) {
            isResetPinVerification = false;
            pinEntered = "";
            for (var i = 1; i <= 4; i++) {
                var b = document.getElementById("bullet-" + i);
                if (b) b.className = "w-4 h-4 rounded-full border-2 border-slate-400/80 transition-all duration-200";
            }
            var screen = document.getElementById('pinScreen');
            if (screen) {
                screen.classList.add('opacity-0');
                setTimeout(function () {
                    screen.style.display = 'none';
                    var pinInstructions = document.getElementById('pinInstructions');
                    if (pinInstructions) {
                        pinInstructions.innerText = "Masukkan kode PIN keamanan Anda untuk mengakses Savora";
                    }
                    var btnClearEl = document.getElementById('pinBtnClear');
                    if (btnClearEl) btnClearEl.innerText = "HAPUS";
                }, 300);
            }
            showToast("Dibatalkan", "Verifikasi PIN dibatalkan.", "info");
            return;
        }

        pinEntered = "";
        for (var i = 1; i <= 4; i++) {
            var b = document.getElementById("bullet-" + i);
            if (b) b.className = "w-4 h-4 rounded-full border-2 border-slate-400/80 transition-all duration-200";
        }
    }

    function deleteLastPin() {
        if (pinEntered.length > 0) {
            var b = document.getElementById("bullet-" + pinEntered.length);
            if (b) b.className = "w-4 h-4 rounded-full border-2 border-slate-400/80 transition-all duration-200";
            pinEntered = pinEntered.slice(0, -1);
        }
    }

    function initInactivityLock() {
        var idleTime;
        var resetTimer = function () {
            clearTimeout(idleTime);
            idleTime = setTimeout(lockSystem, 180000);
        };
        var lockSystem = function () {
            var pinEnabled = localStorage.getItem('savora_pin_enabled') === 'true';
            var pinScreen = document.getElementById('pinScreen');
            if (pinEnabled && pinScreen && pinScreen.style.display === 'none') {
                pinScreen.style.display = 'flex';
                pinScreen.classList.remove('opacity-0');
                clearPin();
                showToast("Aplikasi Terkunci", "Savora dikunci otomatis demi keamanan.", "info");
            }
        };
        window.addEventListener('mousemove', resetTimer);
        window.addEventListener('keypress', resetTimer);
        window.addEventListener('touchstart', resetTimer);
        window.addEventListener('scroll', resetTimer);
        resetTimer();
    }

    // BATCH DATA INITIALIZATION
    function initializeData(targetTab) {
        if (checkIsGAS()) {
            isGAS = true;
            loadAllDataFromGAS(targetTab);
        } else {
            isGAS = false;
            transactions = JSON.parse(localStorage.getItem('savora_transactions')) || mockTransactions;
            savings = JSON.parse(localStorage.getItem('savora_savings')) || mockSavings;
            categories = JSON.parse(localStorage.getItem('savora_categories')) || mockCategories;
            accounts = JSON.parse(localStorage.getItem('savora_accounts')) || mockAccounts;
            calendarEventsData = JSON.parse(localStorage.getItem('savora_calendar_events')) || [];

            recalculateSavingsPocketBalance();
            switchTab(targetTab);
            renderAllUI();
            runActiveNotificationScan();
        }
    }

    // SINKRONISASI CACHING DAN DATA BUNDLE
    function loadAllDataFromGAS(targetTab) {
        showToast("Sinkronisasi", "Menghubungkan ke Google Sheets...", "info");
        txOffset = 0;
        isLoadingMoreTx = false;

        renderDashboardSkeletons();
        renderTransactionsSkeletons();
        renderSavingsSkeletons();

        google.script.run
            .withSuccessHandler(function (bundle) {
                if (!bundle || !bundle.success) {
                    showToast("Gagal Sinkron", bundle ? bundle.message : "Bundel data kosong.", "error");
                    fallbackToLocalStorage(targetTab);
                    return;
                }

                totalTxCount = bundle.totalTxCount;
                transactions = bundle.transactions;
                savings = bundle.savings;
                categories = bundle.categories;
                accounts = bundle.accounts;
                calendarEventsData = bundle.calendarEvents;

                recalculateSavingsPocketBalance();
                switchTab(targetTab);
                renderAllUI();
                runActiveNotificationScan();
                showToast("Sinkronisasi Sukses", "Database finansial ter-load sempurna!", "success");
            })
            .withFailureHandler(function (err) {
                showToast("Gagal Sinkron", err.toString(), "warning");
                fallbackToLocalStorage(targetTab);
            })
            .getSavoraMegaBundle(txPageSize, txOffset);
    }

    function fallbackToLocalStorage(targetTab) {
        transactions = JSON.parse(localStorage.getItem('savora_transactions')) || mockTransactions;
        savings = JSON.parse(localStorage.getItem('savora_savings')) || mockSavings;
        categories = JSON.parse(localStorage.getItem('savora_categories')) || mockCategories;
        accounts = JSON.parse(localStorage.getItem('savora_accounts')) || mockAccounts;
        recalculateSavingsPocketBalance();
        switchTab(targetTab);
        renderAllUI();
    }

    function recalculateSavingsPocketBalance() {
        var totalPocket = 0;
        savings.forEach(function (s) {
            if (s.status !== "Tercapai") {
                totalPocket += Number(s.terkumpul || 0);
            }
        });
        accounts.forEach(function (a) {
            if (a.namaakun === "Savings Pocket" || a.tipe === "Savings") {
                a.saldo = totalPocket;
            }
        });
        if (!checkIsGAS()) {
            localStorage.setItem('savora_accounts', JSON.stringify(accounts));
        }
    }

    // INFINITE SCROLL / LAZY LOADING TRANSAKSI
    function loadMoreTransactions() {
        if (isLoadingMoreTx) return;
        if (transactions.length >= totalTxCount && isGAS) return;

        isLoadingMoreTx = true;
        txOffset += txPageSize;

        var tableBody = document.getElementById('txTableBody');
        if (tableBody) {
            tableBody.insertAdjacentHTML('beforeend',
                '<tr id="txLoadingRow" class="border-b border-slate-100">' +
                '  <td colspan="6" class="py-4 text-center text-xs text-slate-400">' +
                '    <i class="fa-solid fa-circle-notch animate-spin text-savora-orange mr-2"></i> Memuat transaksi tambahan...' +
                '  </td>' +
                '</tr>'
            );
        }

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (newTx) {
                    var loadingRow = document.getElementById('txLoadingRow');
                    if (loadingRow) loadingRow.remove();

                    if (newTx && newTx.length > 0) {
                        transactions = transactions.concat(newTx);
                        renderTransactionsTable();
                    }
                    isLoadingMoreTx = false;
                })
                .withFailureHandler(function () {
                    var loadingRow = document.getElementById('txLoadingRow');
                    if (loadingRow) loadingRow.remove();
                    isLoadingMoreTx = false;
                })
                .getTransactionData(txPageSize, txOffset);
        } else {
            setTimeout(function () {
                var loadingRow = document.getElementById('txLoadingRow');
                if (loadingRow) loadingRow.remove();
                isLoadingMoreTx = false;
            }, 500);
        }
    }

    // TAB NAVIGATOR AND CONTROLLER
    function switchTab(tabId) {
        triggerHaptic(20);
        localStorage.setItem('savora_active_tab', tabId);

        document.querySelectorAll('.tab-content').forEach(function (el) { el.classList.add('hidden'); });

        var activeTabEl = document.getElementById('tab-' + tabId);
        if (activeTabEl) {
            activeTabEl.classList.remove('hidden');
            activeTabEl.classList.add('fade-in');
        }

        // Navigasi Desktop
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
            var icon = btn.querySelector('i');
            if (btn.getAttribute('data-tab') === tabId) {
                btn.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition duration-200 text-sm font-bold bg-white/10 text-white";
                if (icon) {
                    icon.classList.remove('text-slate-400');
                    icon.classList.add('text-savora-orange');
                }
            } else {
                btn.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition duration-200 text-sm font-medium hover:bg-white/5 text-slate-300";
                if (icon) {
                    icon.classList.remove('text-savora-orange');
                    icon.classList.add('text-slate-400');
                }
            }
        });

        // Navigasi Mobile
        document.querySelectorAll('.mobile-tab-btn').forEach(function (btn) {
            if (btn.getAttribute('data-tab') === tabId) {
                btn.className = "mobile-tab-btn flex flex-col items-center text-savora-800 transition duration-150";
            } else {
                btn.className = "mobile-tab-btn flex flex-col items-center text-slate-400 transition duration-150";
            }
        });

        var titleHeader = document.getElementById('pageTitleHeader');
        var descHeader = document.getElementById('pageDescHeader');
        if (titleHeader && descHeader && pageTitles[currentLanguage][tabId]) {
            titleHeader.innerText = pageTitles[currentLanguage][tabId][0];
            descHeader.innerText = pageTitles[currentLanguage][tabId][1];
        }

        if (tabId === 'dashboard') renderDashboard();
        else if (tabId === 'transactions') renderTransactionsTable();
        else if (tabId === 'savings') renderSavings();
        else if (tabId === 'statistics') renderStats();
        else if (tabId === 'calendar') renderCalendar();
        else if (tabId === 'categories') renderCategories();
        else if (tabId === 'ai_assistant') {
            // LAZY LOAD CHAT HISTORY LENGKAP SAAT TAB AI DIBUKA
            if (checkIsGAS() && navigator.onLine) {
                google.script.run
                    .withSuccessHandler(function (chats) {
                        if (chats && Array.isArray(chats)) {
                            consultChatHistory = chats.filter(function (c) { return c.mode === 'consult'; });
                            catatChatHistory = chats.filter(function (c) { return c.mode === 'catat'; });
                            renderAiChatHistory();
                        }
                    })
                    .getChatHistoryData();
            } else {
                renderAiChatHistory();
            }
        }
        else if (tabId === 'notifications') renderNotificationHistoryList();
        else if (tabId === 'settings') renderSettings();
        else if (tabId === 'help') renderHelpSupport();
    }

    function renderAllUI() {
        // Amankan seluruh status array jika bernilai kosong/null setelah Factory Reset
        if (!transactions || !Array.isArray(transactions)) transactions = [];
        if (!savings || !Array.isArray(savings)) savings = [];
        if (!categories || !Array.isArray(categories)) categories = [];
        if (!accounts || !Array.isArray(accounts)) accounts = [];
        if (!calendarEventsData || !Array.isArray(calendarEventsData)) calendarEventsData = [];

        renderDashboard();
        renderTransactionsTable();
        renderSavings();
        renderStats();
        renderCalendar();
        renderCategories();
        renderAccounts();
    }

    function renderDashboard() {
        var totalBalance = 0;
        var totalIncome = 0;
        var totalExpense = 0;

        // Amankan looping rekening untuk total dana
        if (accounts && Array.isArray(accounts)) {
            accounts.forEach(function (a) {
                if (selectedActiveAccount === "Semua" || a.namaakun === selectedActiveAccount) {
                    totalBalance += Number(a.saldo || 0);
                }
            });
        }

        // Amankan looping mutasi kas
        if (transactions && Array.isArray(transactions)) {
            transactions.forEach(function (t) {
                var isAccountMatch = (selectedActiveAccount === "Semua" || t.akun === selectedActiveAccount || t.transferke === selectedActiveAccount);
                if (isAccountMatch) {
                    if (t.tipe === "Income") {
                        totalIncome += Number(t.jumlah || 0);
                    } else if (t.tipe === "Expense") {
                        totalExpense += Number(t.jumlah || 0);
                    }
                }
            });
        }

        var balEl = document.getElementById('dashTotalBalance');
        var incEl = document.getElementById('dashTotalIncome');
        var expEl = document.getElementById('dashTotalExpense');

        if (balEl) {
            if (isBalanceHidden) {
                balEl.innerText = "••••••••";
            } else {
                balEl.innerText = formatMoney(totalBalance);
            }
        }
        if (incEl) incEl.innerText = formatMoney(totalIncome);
        if (expEl) expEl.innerText = formatMoney(totalExpense);

        renderAccountsSlider();
        renderRecentTransactions();
        renderBudgetWidget();
    }

    function formatMoney(amount) {
        var isUSD = localStorage.getItem('savora_currency') === 'USD';
        if (isUSD) {
            var converted = (Number(amount || 0) / 15000).toFixed(2);
            return "$" + Number(converted).toLocaleString('en-US');
        }
        return "Rp " + Math.round(amount || 0).toLocaleString('id-ID');
    }

    function renderAccountsSlider() {
        var container = document.getElementById('accountsSliderContainer');
        if (!container) return;

        var totalBalanceMoney = formatMoney(accounts.reduce(function (sum, a) { return sum + Number(a.saldo || 0); }, 0));
        var activeClass = selectedActiveAccount === "Semua" ? "bg-savora-900 border-savora-orange text-white shadow-lg scale-105" : "bg-white border-slate-200/80 text-slate-800 hover:border-slate-300";
        var textClass = selectedActiveAccount === "Semua" ? "text-slate-300" : "text-slate-400";

        var html = '<div onclick="selectActiveAccountSlider(\'Semua\')" class="shrink-0 w-36 rounded-2xl p-4 border transition-all duration-300 cursor-pointer ' + activeClass + '">' +
            '  <p class="text-[9px] font-bold uppercase tracking-wider ' + textClass + '">METODE KAS</p>' +
            '  <h4 class="font-extrabold text-xs truncate mt-1">Semua Rekening</h4>' +
            '  <p class="text-xs font-bold mt-2 font-mono">' + totalBalanceMoney + '</p>' +
            '</div>';

        if (accounts && Array.isArray(accounts)) {
            accounts.forEach(function (a) {
                var isSelected = selectedActiveAccount === a.namaakun;
                var accIcon = '<i class="fa-solid fa-wallet"></i>';
                if (a.tipe === "Bank" || a.tipe === "M-Banking") accIcon = '<i class="fa-solid fa-building-columns"></i>';
                else if (a.tipe === "E-Wallet") accIcon = '<i class="fa-solid fa-mobile-screen-button"></i>';
                else if (a.tipe === "Savings") accIcon = '<i class="fa-solid fa-piggy-bank"></i>';

                var accountActiveClass = isSelected ? "bg-savora-900 border-savora-orange text-white shadow-lg scale-105" : "bg-white border-slate-200/80 text-slate-800 hover:border-slate-300";
                var accountTextClass = isSelected ? "text-slate-300" : "text-slate-400";
                var translatedType = translateDbValue(a.tipe);
                var formattedAccSaldo = formatMoney(a.saldo || 0);

                html += '<div onclick="selectActiveAccountSlider(\'' + a.namaakun + '\')" class="shrink-0 w-36 rounded-2xl p-4 border transition-all duration-300 cursor-pointer ' + accountActiveClass + '">' +
                    '  <p class="text-[9px] font-bold uppercase tracking-wider flex items-center gap-1 ' + accountTextClass + '">' +
                    '    ' + accIcon + ' ' + translatedType + '' +
                    '  </p>' +
                    '  <h4 class="font-extrabold text-xs truncate mt-1">' + a.namaakun + '</h4>' +
                    '  <p class="text-xs font-bold mt-2 font-mono">' + formattedAccSaldo + '</p>' +
                    '</div>';
            });

        container.innerHTML = html;
    }

    function selectActiveAccountSlider(accName) {
        triggerHaptic(30);
        selectedActiveAccount = accName;
        renderDashboard();
    }

    function renderRecentTransactions() {
        var container = document.getElementById('dashTransactionsList');
        if (!container) return;

        var filtered = [].concat(transactions);
        if (selectedActiveAccount !== "Semua") {
            filtered = filtered.filter(function (t) { return t.akun === selectedActiveAccount || t.transferke === selectedActiveAccount; });
        }

        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm"><p>Belum ada aktivitas transaksi.</p></div>';
            return;
        }

        var html = '';
        filtered.sort(function (a, b) { return new Date(b.tanggal).getTime() - new Date(a.tanggal).getTime(); });
        filtered.slice(0, 5).forEach(function (t) {
            var iconClass = t.tipe === "Income" ? "bg-emerald-50 text-emerald-600" : (t.tipe === "Transfer" ? "bg-blue-50 text-blue-600" : "bg-rose-50 text-rose-600");
            var icon = t.tipe === "Income" ? '<i class="fa-solid fa-arrow-down"></i>' : (t.tipe === "Transfer" ? '<i class="fa-solid fa-money-bill-transfer"></i>' : '<i class="fa-solid fa-arrow-up"></i>');
            var sign = t.tipe === "Income" ? "+ " : (t.tipe === "Transfer" ? "" : "- ");
            var amountColor = t.tipe === "Income" ? "text-emerald-600" : (t.tipe === "Transfer" ? "text-blue-600" : "text-rose-600");

            html += '<div class="flex items-center justify-between p-3.5 hover:bg-slate-50 border border-slate-100/50 rounded-2xl transition duration-150 animate-fadeIn">' +
                '  <div class="flex items-center gap-3 min-w-0">' +
                '    <span class="w-9 h-9 rounded-xl flex items-center justify-center text-sm ' + iconClass + '">' + icon + '</span>' +
                '    <div class="min-w-0">' +
                '      <h4 class="font-bold text-xs text-slate-800 truncate">' + t.deskripsi + '</h4>' +
                '      <p class="text-[10px] text-slate-400 mt-0.5">' + t.kategori + ' • ' + t.akun + '</p>' +
                '    </div>' +
                '  </div>' +
                '  <p class="font-bold font-mono text-xs ' + amountColor + ' shrink-0 text-right">' + sign + formatMoney(t.jumlah) + '</p>' +
                '</div>';
        });

        container.innerHTML = html;
    }

    function renderBudgetWidget() {
        var container = document.getElementById('dashBudgetWidget');
        if (!container) return;

        var limitCategories = categories.filter(function (c) { return c.tipe === "Expense" && c.limitbulanan > 0; });
        if (limitCategories.length === 0) {
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada batas anggaran bulanan.</p>';
            return;
        }

        var html = '';
        limitCategories.forEach(function (c) {
            var spent = 0;
            transactions.forEach(function (t) {
                if (t.tipe === "Expense" && t.kategori === c.namakategori) spent += Number(t.jumlah);
            });

            var percent = Math.min(100, Math.round((spent / c.limitbulanan) * 100));
            var progressColor = percent >= 90 ? "bg-rose-500 animate-pulse" : (percent >= 75 ? "bg-amber-500" : "bg-emerald-500");

            html += '<div class="space-y-1.5">' +
                '  <div class="flex justify-between text-xs font-semibold">' +
                '    <span class="text-slate-700">' + c.namakategori + '</span>' +
                '    <span class="text-slate-400 font-mono text-[10px]">' + percent + '%</span>' +
                '  </div>' +
                '  <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-200/30">' +
                '    <div class="' + progressColor + ' h-2 rounded-full transition-all duration-300" style="width: ' + percent + '%"></div>' +
                '  </div>' +
                '  <div class="flex justify-between text-[9px] text-slate-400 font-bold font-mono">' +
                '    <span>Pakai: ' + formatMoney(spent) + '</span>' +
                '    <span>Sisa: ' + formatMoney(Math.max(0, c.limitbulanan - spent)) + '</span>' +
                '  </div>' +
                '</div>';
        });

        container.innerHTML = html;
    }

    // TRANSACTIONS TABLE
    function renderTransactionsTable() {
        var tableBody = document.getElementById('txTableBody');
        var emptyState = document.getElementById('txEmptyState');
        if (!tableBody) return;

        tableBody.innerHTML = '';
        var searchVal = document.getElementById('txSearch').value.toLowerCase().trim();
        var filterType = document.getElementById('txFilterType').value;
        var filterCat = document.getElementById('txFilterCategory').value;
        var sortBy = document.getElementById('txSort').value;

        var filtered = [].concat(transactions);

        if (searchVal) {
            filtered = filtered.filter(function (t) { return t.deskripsi.toLowerCase().includes(searchVal); });
        }
        if (filterType !== "Semua") {
            filtered = filtered.filter(function (t) { return t.tipe === filterType; });
        }
        if (filterCat !== "Semua") {
            filtered = filtered.filter(function (t) { return t.kategori === filterCat; });
        }

        if (sortBy === "Terlama") {
            filtered.sort(function (a, b) { return new Date(a.tanggal).getTime() - new Date(b.tanggal).getTime(); });
        } else if (sortBy === "Tertinggi") {
            filtered.sort(function (a, b) { return b.jumlah - a.jumlah; });
        } else if (sortBy === "Terendah") {
            filtered.sort(function (a, b) { return a.jumlah - b.shadow; });
        } else {
            filtered.sort(function (a, b) { return new Date(b.tanggal).getTime() - new Date(a.tanggal).getTime(); });
        }

        if (filtered.length === 0) {
            if (emptyState) emptyState.classList.remove('hidden');
            return;
        }
        if (emptyState) emptyState.classList.add('hidden');

        populateCategoryDropdowns();

        filtered.forEach(function (t) {
            var badgeClass = t.tipe === "Income" ? "bg-emerald-50 text-emerald-600 border-emerald-100" : (t.tipe === "Transfer" ? "bg-blue-50 text-blue-600 border-blue-100" : "bg-rose-50 text-rose-600 border-rose-100");
            var transferToHtml = t.transferke ? ('<span class="text-[10px] text-blue-500 font-bold block mt-0.5"><i class="fa-solid fa-arrow-right"></i> Ke: ' + t.transferke + '</span>') : '';

            tableBody.insertAdjacentHTML('beforeend',
                '<tr class="hover:bg-slate-50 transition border-b border-slate-100">' +
                '  <td class="py-3 px-4 text-xs font-semibold text-slate-500 font-mono">' + t.tanggal.split(' ')[0] + '</td>' +
                '  <td class="py-3 px-4"><span class="px-2.5 py-1 text-[10px] rounded-full font-bold uppercase tracking-wide ' + badgeClass + '">' + t.tipe + '</span></td>' +
                '  <td class="py-3 px-4 font-bold text-xs text-slate-700">' + t.kategori + '</td>' +
                '  <td class="py-3 px-4 text-xs text-slate-600 font-medium">' + t.deskripsi + transferToHtml + '</td>' +
                '  <td class="py-3 px-4 text-right font-extrabold font-mono text-xs text-slate-800">' + formatMoney(t.jumlah) + '</td>' +
                '  <td class="py-3 px-4 text-center">' +
                '    <button onclick="triggerDeleteTransaction(\'' + t.id + '\')" class="p-1.5 hover:bg-rose-50 text-rose-500 rounded-lg transition"><i class="fa-regular fa-trash-can"></i></button>' +
                '  </td>' +
                '</tr>'
            );
        });
    }

    function populateCategoryDropdowns() {
        var filterCatDropdown = document.getElementById('txFilterCategory');
        var formCatDropdown = document.getElementById('txCategory');
        if (!filterCatDropdown || !formCatDropdown) return;

        var currentFilterVal = filterCatDropdown.value;
        var currentFormVal = formCatDropdown.value;

        filterCatDropdown.innerHTML = '<option value="Semua">Semua Kategori</option>';
        formCatDropdown.innerHTML = '';

        categories.forEach(function (c) {
            filterCatDropdown.insertAdjacentHTML('beforeend', '<option value="' + c.namakategori + '">' + c.namakategori + '</option>');
            if (c.tipe === currentFormType) {
                formCatDropdown.insertAdjacentHTML('beforeend', '<option value="' + c.namakategori + '">' + translateDbValue(c.namakategori) + '</option>');
            }
        });

        filterCatDropdown.value = currentFilterVal || "Semua";
        if (formCatDropdown.options.length > 0) {
            formCatDropdown.value = currentFormVal || formCatDropdown.options[0].value;
        }
    }

    var selectedDeleteTxId = null;
    function triggerDeleteTransaction(id) {
        selectedDeleteTxId = id;
        triggerHaptic([100, 50]);

        var modal = document.getElementById('confirmModal');
        var card = document.getElementById('confirmCard');
        var title = document.getElementById('confirmTitle');
        var desc = document.getElementById('confirmDesc');

        if (modal && card && title && desc) {
            title.innerText = "Hapus Transaksi?";
            desc.innerText = "Uang akan dikembalikan secara asinkron ke saldo rekening asal.";
            modal.classList.remove('hidden');
            setTimeout(function () {
                modal.classList.add('opacity-100');
                card.classList.remove('scale-95');
            }, 10);
        }
    }

    function executeDeleteTransaction(id) {
        closeConfirmModal();
        showToast("Memproses...", "Menghapus transaksi di cloud...", "info");

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (response.success) {
                        triggerHaptic([100, 50, 100]);
                        showToast("Hapus Berhasil", response.message, "success");
                        loadAllDataFromGAS(localStorage.getItem('savora_active_tab') || 'transactions');
                    } else {
                        showToast("Gagal", response.message, "error");
                    }
                })
                .withFailureHandler(function (e) {
                    showToast("Error", e.toString(), "error");
                })
                .deleteTransaction(id);
        } else {
            var txObj = transactions.find(function (t) { return t.id === id; });
            if (txObj) {
                var srcAcc = accounts.find(function (a) { return a.namaakun === txObj.akun; });
                if (srcAcc) {
                    if (txObj.tipe === "Expense" || txObj.tipe === "Savings" || txObj.tipe === "Transfer") {
                        srcAcc.saldo = Number(srcAcc.saldo) + Number(txObj.jumlah);
                    } else if (txObj.tipe === "Income") {
                        srcAcc.saldo = Number(srcAcc.saldo) - Number(txObj.jumlah);
                    }
                }
                if (txObj.tipe === "Transfer" && txObj.transferke) {
                    var destAcc = accounts.find(function (a) { return a.namaakun === txObj.transferke; });
                    if (destAcc) destAcc.saldo = Number(destAcc.saldo) - Number(txObj.jumlah);
                }
                if (txObj.tipe === "Savings") {
                    var sGoal = savings.find(function (s) { return s.namatarget === txObj.kategori; });
                    if (sGoal) {
                        sGoal.terkumpul = Math.max(0, Number(sGoal.terkumpul) - Number(txObj.jumlah));
                        sGoal.status = "Aktif";
                    }
                }
            }
            transactions = transactions.filter(function (t) { return t.id !== id; });
            localStorage.setItem('savora_transactions', JSON.stringify(transactions));
            localStorage.setItem('savora_accounts', JSON.stringify(accounts));
            localStorage.setItem('savora_savings', JSON.stringify(savings));
            recalculateSavingsPocketBalance();
            initializeData('transactions');
            showToast("Berhasil", "Transaksi dihapus secara lokal.", "success");
        }
    }

    function executeDeleteSavingGoal(id) {
        closeConfirmModal();
        showToast("Memproses...", "Menghapus rencana tabungan di cloud...", "info");

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (response.success) {
                        triggerHaptic([100, 50, 100]);
                        showToast("Hapus Berhasil", response.message, "success");
                        loadAllDataFromGAS('savings');
                    } else {
                        showToast("Gagal", response.message, "error");
                    }
                })
                .withFailureHandler(function (e) {
                    showToast("Error", e.toString(), "error");
                })
                .deleteSavingGoal(id);
        } else {
            savings = savings.filter(function (s) { return s.id !== id; });
            localStorage.setItem('savora_savings', JSON.stringify(savings));
            recalculateSavingsPocketBalance();
            initializeData('savings');
            showToast("Berhasil", "Target tabungan deleted secara lokal.", "success");
        }
    }

    function checkContribOverdraft() {
        var amt = Number(document.getElementById('contribAmount').value) || 0;
        var srcName = document.getElementById('contribSourceAccount').value;
        var srcAcc = accounts.find(function (a) { return a.namaakun === srcName; });

        var banner = document.getElementById('contribOverdraftWarning');
        var confirmBtn = document.getElementById('contribConfirmBtn');

        if (srcAcc && amt > srcAcc.saldo) {
            if (banner) banner.classList.remove('hidden');
            if (confirmBtn) confirmBtn.disabled = true;
        } else {
            if (banner) banner.classList.add('hidden');
            if (confirmBtn) confirmBtn.disabled = false;
        }

    function saveSavingContribution() {
        var id = document.getElementById('contribId').value;
        var amt = Number(document.getElementById('contribAmount').value) || 0;
        var srcAcc = document.getElementById('contribSourceAccount').value;
        var targetGoal = savings.find(function (s) { return s.id === id; });

        if (amt <= 0 || !targetGoal) return;

        closeSavingContributionModal();
        showToast("Memproses...", "Mencatat setoran tabungan di cloud...", "info");

        var txPayload = {
            tipe: "Savings",
            kategori: targetGoal.namatarget,
            jumlah: amt,
            deskripsi: "Setoran tabungan: " + targetGoal.namatarget,
            akun: srcAcc,
            transferke: "Savings Pocket"
        };

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (resTx) {
                    triggerHaptic([100, 50, 100]);
                    showToast("Sukses", "Uang berhasil dialokasikan ke saku tabungan!", "success");
                    loadAllDataFromGAS('savings');
                })
                .withFailureHandler(function (err) {
                    showToast("Gagal Setor", err.toString(), "error");
                })
                .addTransaction(txPayload);
        } else {
            targetGoal.terkumpul = Number(targetGoal.terkumpul) + amt;
            if (targetGoal.terkumpul >= targetGoal.targetjumlah) {
                targetGoal.status = "Tercapai";
            }
            localStorage.setItem('savora_savings', JSON.stringify(savings));

            var accountSrcObj = accounts.find(function (a) { return a.namaakun === srcAcc; });
            if (accountSrcObj) {
                accountSrcObj.saldo = Number(accountSrcObj.saldo) - amt;
            }

            transactions.unshift({
                id: "TX_TEMP_" + new Date().getTime(),
                tanggal: new Date().toISOString().replace('T', ' ').substring(0, 19),
                tipe: "Savings",
                kategori: targetGoal.namatarget,
                jumlah: amt,
                deskripsi: txPayload.deskripsi,
                akun: srcAcc,
                transferke: "Savings Pocket"
            });

            localStorage.setItem('savora_transactions', JSON.stringify(transactions));
            recalculateSavingsPocketBalance();
            initializeData('savings');
            showToast("Berhasil", "Setoran tabungan diproses secara lokal.", "success");
        }
    }

    function drawAnalyticalSvgChart() {
        var container = document.getElementById('statsChartContainer');
        if (!container) return;

        var daysData = {};
        for (var d = 1; d <= 30; d++) daysData[d] = { inc: 0, exp: 0 };

        transactions.forEach(function (t) {
            var dateParts = t.tanggal.split(' ')[0].split('-');
            if (dateParts[0] === "2026" && dateParts[1] === "06") {
                var isAccountMatch = (selectedActiveAccount === "Semua" || t.akun === selectedActiveAccount || t.transferke === selectedActiveAccount);
                if (isAccountMatch) {
                    var day = parseInt(dateParts[2]);
                    if (daysData[day]) {
                        if (t.tipe === "Income") daysData[day].inc += t.jumlah;
                        else if (t.tipe === "Expense") daysData[day].exp += t.jumlah;
                    }
                }
            }
        });

        var width = 500; var height = 180; var padding = 25;
        var chartWidth = width - (padding * 2); var chartHeight = height - (padding * 2);

        var maxVal = 100000;
        for (var dayIdx = 1; dayIdx <= 30; dayIdx++) {
            if (daysData[dayIdx].inc > maxVal) maxVal = daysData[dayIdx].inc;
            if (daysData[dayIdx].exp > maxVal) maxVal = daysData[dayIdx].exp;
        }
        maxVal = maxVal * 1.15;

        var pointsInc = []; var pointsExp = [];
        for (var dIdx = 1; dIdx <= 30; dIdx++) {
            var x = padding + ((dIdx - 1) / 29) * chartWidth;
            var yInc = padding + chartHeight - (daysData[dIdx].inc / maxVal) * chartHeight;
            var yExp = padding + chartHeight - (daysData[dIdx].exp / maxVal) * chartHeight;
            pointsInc.push({ x: x, y: yInc, val: daysData[dIdx].inc });
            pointsExp.push({ x: x, y: yExp, val: daysData[dIdx].exp });
        }

        var baselineY = padding + chartHeight;
        var pathIncLine = pointsInc.map(function (p, i) { return (i === 0 ? 'M' : 'L') + ' ' + p.x + ' ' + p.y; }).join(' ');
        var pathIncArea = pathIncLine + " L " + pointsInc[pointsInc.length - 1].x + " " + baselineY + " L " + pointsInc[0].x + " " + baselineY + " Z";

        var pathExpLine = pointsExp.map(function (p, i) { return (i === 0 ? 'M' : 'L') + " " + p.x + " " + p.y; }).join(' ');
        var pathExpArea = pathExpLine + " L " + pointsExp[pointsExp.length - 1].x + " " + baselineY + " L " + pointsExp[0].x + " " + baselineY + " Z";

        var nodesHtmlInc = pointsInc.filter(function (p) { return p.val > 0; }).map(function (p) {
            return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />';
        }).join('');

        var nodesHtmlExp = pointsExp.filter(function (p) { return p.val > 0; }).map(function (p) {
            return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="#F97316" stroke="#ffffff" stroke-width="1.5" />';
        }).join('');

        container.innerHTML = '<svg viewBox="0 0 ' + width + ' ' + height + '" class="w-full h-auto text-[10px] select-none">' +
            '<defs>' +
            '  <linearGradient id="incAreaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></linearGradient>' +
            '  <linearGradient id="expAreaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F97316" stop-opacity="0.2"/><stop offset="100%" stop-color="#F97316" stop-opacity="0"/></linearGradient>' +
            '</defs>' +
            '<line x1="' + padding + '" y1="' + padding + '" x2="' + (width - padding) + '" y2="' + padding + '" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3 3" />' +
            '<line x1="' + padding + '" y1="' + baselineY + '" x2="' + (width - padding) + '" y2="' + baselineY + '" stroke="#e2e8f0" stroke-width="1" />' +
            '<text x="' + (padding + 5) + '" y="' + (padding - 5) + '" fill="#94a3b8">' + formatMoney(maxVal) + '</text>' +
            '<path d="' + pathIncArea + '" fill="url(#incAreaGrad)" />' +
            '<path d="' + pathExpArea + '" fill="url(#expAreaGrad)" />' +
            '<path d="' + pathIncLine + '" fill="none" stroke="#10b981" stroke-width="2" />' +
            '<path d="' + pathExpLine + '" fill="none" stroke="#F97316" stroke-width="2" />' +
            nodesHtmlInc + nodesHtmlExp +
            '</svg>';
    }

    function renderStatsBreakdownList() {
        var container = document.getElementById('statisticsBreakdownList');
        if (!container) return;

        var totalExpenseSum = 0;
        var breakdown = {};

        categories.forEach(function (c) { if (c.tipe === "Expense") breakdown[c.namakategori] = 0; });
        transactions.forEach(function (t) {
            if (t.tipe === "Expense" && breakdown[t.kategori] !== undefined) {
                breakdown[t.kategori] += t.jumlah; totalExpenseSum += t.jumlah;
            }
        });

        if (totalExpenseSum === 0) {
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Tidak ada pengeluaran terekam.</p>';
            return;
        }

        var html = '';
        Object.keys(breakdown).forEach(function (cat) {
            var amt = breakdown[cat];
            var percent = Math.round((amt / totalExpenseSum) * 100) || 0;
            html += '<div class="space-y-1">' +
                '<div class="flex justify-between text-xs font-semibold"><span>' + translateDbValue(cat) + '</span><span>' + formatMoney(amt) + ' (' + percent + '%)</span></div>' +
                '<div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden"><div class="bg-savora-orange h-1.5 rounded-full" style="width: ' + percent + '%"></div></div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function renderStatsAssetsList() {
        var container = document.getElementById('statisticsAssetsList');
        if (!container) return;

        var totalAssetsSum = accounts.reduce(function (sum, a) { return sum + Number(a.saldo); }, 0);
        if (totalAssetsSum === 0) {
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Aset kosong.</p>';
            return;
        }

        var html = '';
        accounts.forEach(function (a) {
            var percent = Math.round((a.saldo / totalAssetsSum) * 100) || 0;
            html += '<div class="space-y-1">' +
                '<div class="flex justify-between text-xs font-semibold"><span>' + a.namaakun + '</span><span>' + formatMoney(a.saldo) + ' (' + percent + '%)</span></div>' +
                '<div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden"><div class="bg-savora-800 h-1.5 rounded-full" style="width: ' + percent + '%"></div></div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function drawCalendarGrid() {
        var grid = document.getElementById('calendarGrid');
        var monthLabel = document.getElementById('calendarMonthLabel');
        if (!grid || !monthLabel) return;

        grid.innerHTML = '';

        var year = calCurrentDate.getFullYear();
        var month = calCurrentDate.getMonth();
        var monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        monthLabel.innerText = monthNames[month] + " " + year;

        var calIncome = 0;
        var calExpense = 0;

        transactions.forEach(function (t) {
            var dateParts = t.tanggal.split(' ')[0].split('-');
            if (dateParts.length === 3) {
                var y = parseInt(dateParts[0]);
                var m = parseInt(dateParts[1]) - 1;
                if (y === year && m === month) {
                    if (t.tipe === "Income") calIncome += Number(t.jumlah);
                    else if (t.tipe === "Expense") calExpense += Number(t.jumlah);
                }
            }
        });

        var incEl = document.getElementById('calStatsIncome');
        var expEl = document.getElementById('calStatsExpense');
        var netEl = document.getElementById('calStatsNet');

        if (incEl) incEl.innerText = formatMoney(calIncome);
        if (expEl) expEl.innerText = formatMoney(calExpense);
        if (netEl) {
            var net = calIncome - calExpense;
            netEl.innerText = (net >= 0 ? "+ " : "- ") + formatMoney(Math.abs(net));
            netEl.className = net >= 0 ? "text-xl font-extrabold mt-1 text-emerald-100" : "text-xl font-extrabold mt-1 text-rose-100";
        }

        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();

        for (var i = 0; i < firstDay; i++) {
            grid.insertAdjacentHTML('beforeend', '<div class="bg-transparent aspect-square md:aspect-auto md:h-[3.75rem]"></div>');
        }

        grid.className = "grid grid-cols-7 gap-1.5 md:gap-2 min-h-0 md:min-h-[350px]";

        for (var d = 1; d <= daysInMonth; d++) {
            var dateStr = year + "-" + String(month + 1).padStart(2, '0') + "-" + String(d).padStart(2, '0');
            var isSelected = selectedCalendarDate === dateStr;

            var todayReal = new Date();
            var isToday = (year === todayReal.getFullYear() && month === todayReal.getMonth() && d === todayReal.getDate());

            var dailySpentSum = 0;
            var dailyIncomeSum = 0;
            transactions.forEach(function (t) {
                var txDate = t.tanggal.split(' ')[0];
                if (txDate === dateStr) {
                    if (t.tipe === "Expense" || t.tipe === "Savings") {
                        dailySpentSum += Number(t.jumlah);
                    } else if (t.tipe === "Income") {
                        dailyIncomeSum += Number(t.jumlah);
                    }
                }
            });

            var evObj = calendarEventsData.find(function (e) { return e.tanggal === dateStr; });
            var hasReminders = false;
            if (evObj && evObj.remindersJSON) {
                try {
                    var list = JSON.parse(evObj.remindersJSON);
                    if (list.length > 0) hasReminders = true;
                } catch (e) { }
            }

            var activeClass = isSelected ? "bg-savora-900 border-savora-orange text-white shadow-lg scale-[1.03] z-10" :
                (isToday ? "bg-white border-[#F97316] text-slate-800 shadow-sm shadow-[#F97316]/20 cal-today-glowing" : "bg-slate-50/50 hover:bg-slate-100/50 border-slate-100 text-slate-700");
            var spanClass = isSelected ? "text-white" : (isToday ? "text-[#F97316]" : "text-slate-800");
            var customStyle = isToday ? "border-width: 1.5px;" : "";

            var incomeIndicator = dailyIncomeSum > 0 ? ('<span class="px-1 py-0.2 text-[8px] font-bold rounded-md bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center shrink-0 tracking-tight scale-[0.95]">+' + Math.round(dailyIncomeSum / 1000) + 'k</span>') : '';
            var spentIndicator = dailySpentSum > 0 ? ('<span class="px-1 py-0.2 text-[8px] font-bold rounded-md bg-rose-50 text-rose-600 border border-rose-100 flex items-center justify-center shrink-0 tracking-tight scale-[0.95]">-' + Math.round(dailySpentSum / 1000) + 'k</span>') : '';

            var reminderIndicator = hasReminders ?
                '<span class="absolute top-1 right-1 flex h-1.5 w-1.5">' +
                '  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>' +
                '  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-blue-500"></span>' +
                '</span>' : '';

            appendCalendarBox(grid, d, dateStr, activeClass, customStyle, spanClass, incomeIndicator, spentIndicator, reminderIndicator);
        }

        renderCalendarDayDetail();
    }

    function appendCalendarBox(grid, d, dateStr, activeClass, customStyle, spanClass, incomeIndicator, spentIndicator, reminderIndicator) {
        grid.insertAdjacentHTML('beforeend',
            '<div onclick="selectCalendarDate(\'' + dateStr + '\')"' +

            '     style="' + customStyle + '">' +
            '  <span class="text-[11px] md:text-xs font-bold ' + spanClass + '">' + d + '</span>' +
            '  <div class="flex flex-col items-center gap-0.5 w-full mt-0.5 md:mt-1">' +
            '    ' + incomeIndicator + '' +
            '    ' + spentIndicator + '' +
            '  </div>' +
            '  ' + reminderIndicator + '' +
            '</div>'
        );
    }

    function renderCalendarDayDetail() {
        var dateLabel = document.getElementById('calDetailDateLabel');
        if (dateLabel) dateLabel.innerText = selectedCalendarDate;

        var event = calendarEventsData.find(function (e) { return e.tanggal === selectedCalendarDate; }) || { journalText: "", limitBelanja: 0, remindersJSON: "[]" };

        var limitInput = document.getElementById('calDailyLimitInput');
        if (limitInput) limitInput.value = event.limitBelanja || '';

        var dailySpentSum = 0;
        var listHtml = '';
        transactions.forEach(function (t) {
            if (t.tanggal.split(' ')[0] === selectedCalendarDate) {
                if (t.tipe === "Expense") dailySpentSum += t.jumlah;
                listHtml += '<div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100 font-sans">' +
                    '<span class="truncate pr-2"><strong>[' + translateDbValue(t.tipe) + ']</strong> ' + t.deskripsi + '</span>' +
                    '<span class="font-bold shrink-0">' + formatMoney(t.jumlah) + '</span>' +
                    '</div>';
            }
        });

        var txContainer = document.getElementById('calDetailTxList');
        if (txContainer) {
            txContainer.innerHTML = listHtml || '<p class="text-center text-slate-400 py-4 text-[11px]">Tidak ada transaksi tercatat di tanggal ini.</p>';
        }

        var spentLabel = document.getElementById('calDailyLimitSpent');
        if (spentLabel) spentLabel.innerText = formatMoney(dailySpentSum);

        var limitLabel = document.getElementById('calDailyLimitLabel');
        var progressBar = document.getElementById('calDailyLimitProgress');
        var alertBanner = document.getElementById('calDailyLimitWarning');

        if (event.limitBelanja > 0) {
            if (limitLabel) limitLabel.innerText = formatMoney(event.limitBelanja);
            var percent = Math.min(100, Math.round((dailySpentSum / event.limitBelanja) * 100));
            if (progressBar) {
                progressBar.style.width = percent + "%";
                progressBar.className = percent >= 100 ? "bg-rose-500 h-1.5 rounded-full" : "bg-emerald-500 h-1.5 rounded-full";
            }
            if (percent >= 100) {
                if (alertBanner) alertBanner.classList.remove('hidden');
            } else {
                if (alertBanner) alertBanner.classList.add('hidden');
            }
        } else {
            if (limitLabel) limitLabel.innerText = "Tanpa Batas";
            if (progressBar) progressBar.style.width = "0%";
            if (alertBanner) alertBanner.classList.add('hidden');
        }

        var journalArea = document.getElementById('calDailyJournal');
        if (journalArea) journalArea.value = event.journalText || '';

        renderCalendarReminders(event.remindersJSON);
    }

    function renderCalendarReminders(jsonStr) {
        var listContainer = document.getElementById('calRemindersList');
        var badge = document.getElementById('calReminderBadge');
        if (!listContainer) return;

        listContainer.innerHTML = '';
        var reminders = [];
        try {
            reminders = JSON.parse(jsonStr) || [];
        } catch (e) {
            reminders = [];
        }

        if (badge) badge.innerText = reminders.length;

        if (reminders.length === 0) {
            listContainer.innerHTML = '<p class="text-[10px] text-slate-400 text-center py-4">Belum ada agenda tagihan untuk hari ini.</p>';
            return;
        }

        reminders.forEach(function (r, idx) {
            var checkedAttr = r.done ? 'checked' : '';
            var textClass = r.done ? 'line-through text-slate-400' : 'text-slate-700 font-medium';

            listContainer.insertAdjacentHTML('beforeend',
                '<div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100 hover:border-slate-200 transition">' +
                '  <div class="flex items-center gap-2">' +
                '    <input type="checkbox" ' + checkedAttr + ' onchange="toggleCalendarReminderDone(' + idx + ')" class="w-3.5 h-3.5 text-savora-800 focus:ring-0 cursor-pointer">' +
                '    <span class="text-xs ' + textClass + '">' + r.text + '</span>' +
                '  </div>' +
                '  <button onclick="deleteCalendarReminder(' + idx + ')" class="text-slate-400 hover:text-rose-500 transition"><i class="fa-regular fa-trash-can text-xs"></i></button>' +
                '</div>'
            );
        });
    }

    function saveCalendarEventFieldLocal(fieldName, val) {
        var list = JSON.parse(localStorage.getItem('savora_calendar_events')) || [];
        var ev = list.find(function (e) { return e.tanggal === selectedCalendarDate; });
        if (!ev) {
            ev = { tanggal: selectedCalendarDate, journalText: "", limitBelanja: 0, remindersJSON: "[]" };
            list.push(ev);

        ev[fieldName] = val;
        localStorage.setItem('savora_calendar_events', JSON.stringify(list));

    function addCalendarReminder() {
        var input = document.getElementById('calReminderInput');
        var text = input.value.trim();
        if (!text) return;

        triggerHaptic(20);
        var event = calendarEventsData.find(function (e) { return e.tanggal === selectedCalendarDate; }) || { remindersJSON: "[]" };
        var reminders = [];
        try {
            reminders = JSON.parse(event.remindersJSON) || [];
        } catch (e) {
            reminders = [];
        }

        reminders.push({ text: text, done: false });
        var updatedJSON = JSON.stringify(reminders);

        if (checkIsGAS()) {
            google.script.run
                .withSuccessHandler(function () {
                    input.value = '';
                    loadAllDataFromGAS('calendar');
                })
                .saveCalendarEventField(selectedCalendarDate, 'remindersJSON', updatedJSON);
        } else {
            saveCalendarEventFieldLocal('remindersJSON', updatedJSON);
            input.value = '';
            drawCalendarGrid();
        }
    }

    function toggleCalendarReminderDone(idx) {
        triggerHaptic(20);
        var event = calendarEventsData.find(function (e) { return e.tanggal === selectedCalendarDate; });
        if (!event) return;

        var reminders = JSON.parse(event.remindersJSON);
        reminders[idx].done = !reminders[idx].done;
        var updatedJSON = JSON.stringify(reminders);

        if (checkIsGAS()) {
            google.script.run
                .withSuccessHandler(function () {
                    loadAllDataFromGAS('calendar');
                })
                .saveCalendarEventField(selectedCalendarDate, 'remindersJSON', updatedJSON);
        } else {
            saveCalendarEventFieldLocal('remindersJSON', updatedJSON);
            drawCalendarGrid();
        }
    }

    function deleteCalendarReminder(idx) {
        triggerHaptic([100, 50]);
        var event = calendarEventsData.find(function (e) { return e.tanggal === selectedCalendarDate; });
        if (!event) return;

        var reminders = JSON.parse(event.remindersJSON);
        reminders.splice(idx, 1);
        var updatedJSON = JSON.stringify(reminders);

        if (checkIsGAS()) {
            google.script.run
                .withSuccessHandler(function () {
                    loadAllDataFromGAS('calendar');
                })

            drawCalendarGrid();
        }
    }

    function executeDeleteCategory(name) {
        closeConfirmModal();
        showToast("Memproses...", "Menghapus kategori di database...", "info");

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (response.success) {
                        triggerHaptic([100, 50, 100]);
                        showToast("Hapus Sukses", response.message, "success");
                        loadAllDataFromGAS('categories');
                    } else {
                        showToast("Gagal", response.message, "error");
                    }
                })
                .withFailureHandler(function (e) {
                    showToast("Error", e.toString(), "error");
                })
                .deleteCategory(name);
        } else {
            categories = categories.filter(function (c) { return c.namakategori !== name; });
            localStorage.setItem('savora_categories', JSON.stringify(categories));
            initializeData('categories');
            showToast("Berhasil", "Kategori dihapus secara lokal.", "success");
        }
    }

    function testCloudConnection() {
        var btn = document.getElementById('btnTestConnection');
        var status = document.getElementById('connectionTestStatus');
        if (btn && status) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Menguji...';
            status.innerText = "Menghubungkan...";
            status.className = "text-xs font-semibold text-amber-500 animate-pulse";
        }

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (btn && status) {
                        btn.disabled = false;
                        btn.innerHTML = "Uji Koneksi";
                        status.innerText = "Terhubung Lancar";
                        status.className = "text-xs font-semibold text-emerald-500";
                        showToast("Koneksi Berhasil", "Savora AI Engine terhubung sempurna ke Google Cloud!", "success");
                    }
                })
                .withFailureHandler(function (err) {
                    if (btn && status) {
                        btn.disabled = false;
                        btn.innerHTML = "Uji Koneksi";
                        status.innerText = "Gagal Terhubung";
                        status.className = "text-xs font-semibold text-rose-500";
                        showToast("Gagal", err.toString(), "error");
                    }
                })
                .pingServer();
        } else {
            setTimeout(function () {
                if (btn && status) {
                    btn.disabled = false;
                    btn.innerHTML = "Uji Koneksi";
                    status.innerText = "Offline Mode";
                    status.className = "text-xs font-semibold text-yellow-500";
                    showToast("Simulasi Offline", "Savora beroperasi lokal di browser Anda.", "warning");
                }
            }, 800);
        }
    }

    function setFormType(type) {
        triggerHaptic(20);
        currentFormType = type;

        document.querySelectorAll('.type-sel-btn').forEach(function (btn) {
            btn.className = "type-sel-btn py-2 px-1 rounded-xl border-2 border-slate-200 text-slate-500 hover:bg-slate-50 text-[10px] font-bold text-center flex flex-col items-center justify-center gap-1";
        });

        var activeBtn = document.getElementById('btnType' + type);
        if (activeBtn) {
            var activeClass = "border-emerald-500 bg-emerald-50 text-emerald-700";
            if (type === "Expense") activeClass = "border-rose-500 bg-rose-50 text-rose-700";
            else if (type === "Savings") activeClass = "border-purple-50 bg-purple-50 text-purple-700";
            else if (type === "Transfer") activeClass = "border-blue-500 bg-blue-50 text-blue-700";
            activeBtn.className = "type-sel-btn py-2 px-1 rounded-xl border-2 " + activeClass + " text-[10px] font-bold text-center flex flex-col items-center justify-center gap-1";
        }

        var savingsPocketContainer = document.getElementById('savingsPocketSourceContainer');
        var categoryContainer = document.getElementById('formCategoryContainer');
        var tfDestContainer = document.getElementById('transferDestinationContainer');

        if (type === 'Savings') {
            if (savingsPocketContainer) {
                savingsPocketContainer.classList.remove('hidden');
                var goalSelect = document.getElementById('txSavingsGoalSource');
                if (goalSelect) {
                    goalSelect.innerHTML = '';

    function calculateEstimatedSavings() {
        var target = Number(document.getElementById('addSvTarget').value) || 0;
        var initial = Number(document.getElementById('addSvInitial').value) || 0;
        var deadlineVal = document.getElementById('addSvDeadline').value;
        var routine = document.getElementById('addSvJadwalRutin').value;
        var resultBox = document.getElementById('addSvCalculationResult');

        if (target <= 0 || !deadlineVal || !resultBox) {
            if (resultBox) resultBox.classList.add('hidden');
            return;
        }

        var today = new Date();
        var deadline = new Date(deadlineVal);
        var diffTime = deadline.getTime() - today.getTime();
        var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) {
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = '<span class="text-rose-600 font-bold">Error: Tenggat waktu harus di masa depan!</span>';
            return;
        }

        var sisa = Math.max(0, target - initial);
        var months = Math.ceil(diffDays / 30);
        var monthlySetor = Math.round(sisa / Math.max(1, months));

        var formattedSisa = formatMoney(sisa);
        var formattedMonthlySetor = formatMoney(monthlySetor);

        resultBox.classList.remove('hidden');
        resultBox.innerHTML = '<p class="font-bold flex items-center gap-1 text-emerald-800 font-sans">' +
            '  <i class="fa-solid fa-calculator"></i> Analisis Rencana Tabungan Anda' +
            '</p>' +
            '<div class="mt-1.5 space-y-1 text-slate-600 leading-relaxed font-sans">' +
            '  <div>Kekurangan Dana: <strong>' + formattedSisa + '</strong></div>' +
            '  <div>Estimasi Waktu: <strong>' + months + ' Bulan (' + diffDays + ' Hari)</strong></div>' +
            '  <div>Setoran Bulanan: <strong class="text-emerald-600 font-extrabold">' + formattedMonthlySetor + '</strong></div>' +
            '  ' + (routine !== 'Bebas' ? '<div class="text-[10px] text-savora-orange font-bold mt-1 animate-pulse"><i class="fa-solid fa-bell"></i> Savora akan menaruh checklist otomatis di kalender Anda!</div>' : '') + '' +
            '</div>';
    }

    function runOcrSimulationMode(base64, fileObj) {
        setTimeout(function () {
            triggerHaptic([100, 50, 100]);
            closeReceiptScanner();

            var sampleMocks = [
                { amount: 54000, desc: "AT NINE Cafe Space Purwokerto", category: "Food & Beverage" },
                { amount: 57300, desc: "Struk Apotek K-24 Sokaraja", category: "House Needs" },
                { amount: 150000, desc: "SPBU Pertamina Sokaraja", category: "Transportation" }
            ];

            var selectedMock = sampleMocks[0];

            if (fileObj) {
                var fileName = fileObj.name.toLowerCase();
                if (fileName.includes('apotek') || fileName.includes('k-24') || fileName.includes('k24') || fileName.includes('obat')) {
                    selectedMock = sampleMocks[1];
                } else if (fileName.includes('spbu') || fileName.includes('pertamina') || fileName.includes('bensin') || fileName.includes('sokaraja')) {
                    selectedMock = sampleMocks[2];
                } else if (fileName.includes('nine') || fileName.includes('atnine') || fileName.includes('at_nine') || fileName.includes('cafe')) {
                    selectedMock = sampleMocks[0];
                }
            }

            // INTEGRASI DETEKSI WARNA KERTAS STRUK HIJAU KHAS K-24 (RULE 4)
            if (selectedMock === sampleMocks[0]) {
                try {
                    var img = document.getElementById('ocrImagePreview');
                    if (img && img.src) {
                        var canvas = document.createElement('canvas');
                        canvas.width = 10;
                        canvas.height = 10;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 10, 10);
                        var imgData = ctx.getImageData(0, 0, 10, 10).data;
                        var greenPixelsCount = 0;
                        for (var i = 0; i < imgData.length; i += 4) {
                            var r = imgData[i];
                            var g = imgData[i + 1];
                            var b = imgData[i + 2];
                            // Deteksi warna hijau pastel struk Apotek K-24 yang dominan dibanding merah dan biru
                            if (g > r * 1.12 && g > b * 1.12 && g > 50) {
                                greenPixelsCount++;
                            }
                        }
                        if (greenPixelsCount > 15) {
                            selectedMock = sampleMocks[1]; // Alihkan otomatis ke K-24!
                        }
                    }
                } catch (err) {
                    console.log("Analisis piksel warna diabaikan di sandbox lokal: " + err.toString());
                }
            }

            openOcrReviewModal(selectedMock, base64);
            showToast("Scan Sukses (Simulasi)", "Savora AI berhasil memproses data luring.", "success");
        }, 2800);
    }

    function saveOcrReviewTransaction() {
        var desc = document.getElementById('ocrReviewDesc').value.trim();
        var amt = Number(document.getElementById('ocrReviewAmount').value) || 0;
        var category = document.getElementById('ocrReviewCategory').value;
        var account = document.getElementById('ocrReviewAccount').value;

        if (amt <= 0) {

            return;
        }
        if (!desc) {
            showToast("Deskripsi Kosong", "Harap isi catatan belanja singkat!", "warning");
            return;
        }

        closeOcrReviewModal();
        showToast("Mencatat...", "Menyimpan transaksi hasil scan ke cloud...", "info");

        var payload = {
            tipe: "Expense",
            kategori: category,
            jumlah: amt,
            deskripsi: desc,
            akun: account,
            transferke: ""
        };

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (response.success) {
                        triggerHaptic([100, 50, 100]);
                        showToast("Sukses", "Transaksi dari struk belanja berhasil dicatat!", "success");

                    }
                })
                .withFailureHandler(function (err) {
                    showToast("Koneksi Error", err.toString(), "error");
                })
                .addTransaction(payload);
        } else {
            executeLocalTransactionAdd(payload);
        }
    }
