    function parseAndExecuteAiAction(aiReply) {
        var actionRegex = new RegExp("\\|\\|SAVORA_ACTION\\|\\|([\\s\\S]*?)(\\|\\|SAVORA_ACTION\\|\\||\\|\\|)");
        var match = aiReply.match(actionRegex);

        var cleanText = aiReply.replace(actionRegex, '').trim();

        if (match && match[1]) {
            try {
                var jsonStr = match[1].trim();
                var commandObj = JSON.parse(jsonStr);
                if (commandObj.action === "ADD_TRANSACTION") {
                    if (checkIsGAS() && navigator.onLine) {
                        google.script.run
                            .withSuccessHandler(function (res) {
                                triggerHaptic([100, 50, 100]);
                                showToast("Catat AI Sukses", res.message, "success");
                                loadAllDataFromGAS('ai_assistant');
                            })
                            .addTransaction(commandObj.data);
                    } else {
                        executeLocalTransactionAdd(commandObj.data);
                    }
                }
            } catch (e) {
                console.error("Gagal memparsing AI Action payload: " + e.toString());
            }
        }

        return cleanText;
    }

    /**
     * 🤖 IDE 1: SMART AUTO-CREATE CATEGORIES (Client-Side Fallback Guard)
     */
    function executeLocalTransactionAdd(data) {
        var amt = Number(data.jumlah) || 0;
        var account = data.akun;
        var type = data.tipe;
        var desc = data.deskripsi;
        var category = data.kategori;
        var transferTo = data.transferke || "";

        // Autocreate categories lokal asinkron jika belum terdaftar
        if (category && type !== "Transfer") {
            var catExists = categories.some(function (c) {
                return c.namakategori.toLowerCase() === category.toLowerCase();
            });
            if (!catExists) {
                var newCat = { namakategori: category, tipe: type, limitbulanan: 0 };
                categories.push(newCat);
                localStorage.setItem('savora_categories', JSON.stringify(categories));
                populateCategoryDropdowns();
                showToast("Smart Auto-Create Kategori", "Kategori '" + category + "' otomatis ditambahkan ke sistem Savora!", "success");
                triggerHaptic([100, 50, 100]);
            }
        }

        var srcAcc = accounts.find(function (a) { return a.namaakun.toLowerCase() === account.toLowerCase(); });
        if (!srcAcc && account) {
            var autoType = "E-Wallet";
            var lowerAcc = account.toLowerCase();
            if (lowerAcc.includes("bank") || lowerAcc.includes("bca") || lowerAcc.includes("bsi") || lowerAcc.includes("mandiri")) {
                autoType = "Bank";
            }
            srcAcc = {
                id: "ACC_TEMP_" + new Date().getTime(),
                namaakun: account,
                tipe: autoType,
                keterangan: "Dibuat otomatis oleh Savora AI",
                saldo: 0
            };
            accounts.push(srcAcc);
        }

        if (srcAcc) {
            if (type === "Expense" || type === "Savings" || type === "Transfer") {
                srcAcc.saldo = Number(srcAcc.saldo) - amt;
            } else if (type === "Income") {
                srcAcc.saldo = Number(srcAcc.saldo) + amt;
            }
        }

        if (type === "Transfer" && transferTo) {
            var destAcc = accounts.find(function (a) { return a.namaakun.toLowerCase() === transferTo.toLowerCase(); });
            if (!destAcc) {
                var autoTypeDest = "E-Wallet";
                var lowerDest = transferTo.toLowerCase();
                if (lowerDest.includes("bank") || lowerDest.includes("bca") || lowerDest.includes("bsi") || lowerDest.includes("mandiri")) {
                    autoTypeDest = "Bank";
                }
                destAcc = {
                    id: "ACC_TEMP_" + (new Date().getTime() + 1),
                    namaakun: transferTo,
                    tipe: autoTypeDest,
                    keterangan: "Dibuat otomatis oleh Savora AI",
                    saldo: 0
                };
                accounts.push(destAcc);
            }
            if (destAcc) destAcc.saldo = Number(destAcc.saldo) + amt;
        }

        if (type === "Savings") {
            var targetGoal = savings.find(function (s) { return s.namatarget.toLowerCase() === category.toLowerCase(); });
            if (targetGoal) {
                targetGoal.terkumpul = Number(targetGoal.terkumpul) + amt;
                if (targetGoal.terkumpul >= targetGoal.targetjumlah) {
                    targetGoal.status = "Tercapai";
                }
            }
        }

        transactions.unshift({
            id: "TX_TEMP_" + new Date().getTime(),
            tanggal: new Date().toISOString().replace('T', ' ').substring(0, 19),
            tipe: type,
            kategori: category,
            jumlah: amt,
            deskripsi: desc,
            akun: srcAcc ? srcAcc.namaakun : account,
            transferke: transferTo
        });

        localStorage.setItem('savora_transactions', JSON.stringify(transactions));
        localStorage.setItem('savora_accounts', JSON.stringify(accounts));
        localStorage.setItem('savora_savings', JSON.stringify(savings));

        recalculateSavingsPocketBalance();
        initializeData(localStorage.getItem('savora_active_tab') || 'dashboard');
        showToast("Tersimpan Lokal", "Pencatatan simulasi luring AI berhasil!", "success");
    }

    // PARSING MARKDOWN DAN REPLACEMENT DENGAN REGEX LITERALS MURNI (Fixing Double Escaped Backslash Bug GAS)
    function parseMarkdown(text) {
        if (!text) return "";
        var html = text;

        var actionRegex = /\s*\|\|SAVORA_ACTION\|\|[\s\S]*?(\|\|SAVORA_ACTION\|\|[\s\S]*?\|\||\s*\|\|)/g;
        html = html.replace(actionRegex, '');

        var boldRegex = /\*\*(.*?)\*\*/g;
        html = html.replace(boldRegex, '<strong class="text-orange-500 font-bold font-sans">$1</strong>');

        var listRegex = /^[*-]\s+(.*?)(?:\n|$)/gm;
        html = html.replace(listRegex, '<div class="flex items-start gap-2 my-1 pl-2 text-xs text-slate-600"><span class="text-orange-500 shrink-0 font-bold">\u2022</span><span>$1</span></div>');

        var headerRegex = /### (.*?)(?:\n|$)/g;
        html = html.replace(headerRegex, '<h4 class="font-extrabold text-xs text-orange-500 tracking-wide uppercase mt-3 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> $1</h4>');

        var newlineRegex = /\n/g;
        html = html.replace(newlineRegex, '<br>');
        return html;
    }

    var speechRecognizer = null;
    var isListeningActive = false;

    function initSpeechRecognition() {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            showToast("Perekam Suara Error", "Browser ini belum mendukung Web Speech Recognition API.", "warning");
            return;
        }

        speechRecognizer = new SpeechRecognition();
        speechRecognizer.continuous = false;
        speechRecognizer.interimResults = false;
        speechRecognizer.lang = 'id-ID';

        speechRecognizer.onstart = function () {
            isListeningActive = true;
            triggerHaptic(50);
            showToast("Mendengarkan...", "Savora AI sedang merekam suara Anda harian...", "info");

            var micBtn = document.getElementById('aiMicBtn');
            if (micBtn) micBtn.className = "p-3 bg-rose-600 animate-pulse text-white rounded-xl shadow-lg transition";
        };

        speechRecognizer.onerror = function (event) {
            isListeningActive = false;
            resetMicButtonUI();
            if (event.error === 'not-allowed') {
                showToast("Izin Mikrofon Ditolak", "Harap izinkan hak akses perekam pada pengaturan browser Anda.", "warning");
            } else {
                showToast("Gagal Rekam", "Koneksi mikrofon terputus atau tidak menangkap suara.", "warning");
            }
        };

        speechRecognizer.onend = function () {
            isListeningActive = false;
            resetMicButtonUI();
        };

        speechRecognizer.onresult = function (event) {
            var resultText = event.results[0][0].transcript;
            var input = document.getElementById('aiInput');
            if (input && resultText) {
                triggerHaptic([100, 50]);
                input.value = resultText;
                showToast("Suara Terekam", 'Disalin: "' + resultText + '"', "success");
            }
        };
    }

    function toggleVoiceInput() {
        if (!speechRecognizer) {
            initSpeechRecognition();
        }
        if (!speechRecognizer) return;

        if (isListeningActive) {
            speechRecognizer.stop();
        } else {
            try {
                speechRecognizer.start();
            } catch (e) {
                showToast("Gagal", "Sistem perekam suara sedang sibuk, ulangi lagi.", "warning");
            }
        }
    }

    function resetMicButtonUI() {
        var micBtn = document.getElementById('aiMicBtn');
        if (micBtn) micBtn.className = "p-3 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl transition";
    }

    function runActiveNotificationScan() {
        activeNotifications = [];
        var dismissed = JSON.parse(localStorage.getItem('savora_dismissed_notifs')) || [];
        var isDismissed = function (id) { return dismissed.includes(id); };

        var criticalEnabled = localStorage.getItem('savora_pref_critical') !== 'false';
        if (criticalEnabled) {
            var threshold = Number(localStorage.getItem('savora_pref_critical_threshold')) || 1000000;
            accounts.forEach(function (a) {
                var id = 'crit-' + a.id;

                // SENSOR CERDAS: Hitung apakah rekening ini benar-benar aktif digunakan atau baru di-reset
                var hasTx = transactions.some(function (t) { return t.akun === a.namaakun || t.transferke === a.namaakun; });
                var isNewlyReset = (a.saldo === 0 && !hasTx);

                if (a.saldo < threshold && a.namaakun !== "Savings Pocket" && !isDismissed(id) && !isNewlyReset) {
                    activeNotifications.push({
                        id: id,
                        type: 'critical',
                        title: 'Saldo Rekening Kritis!',
                        message: "Saldo di rekening " + a.namaakun + " sisa " + formatMoney(a.saldo) + ". Segera lakukan pemindahan dana agar operasional lancar.",
                        meta: { account: a.namaakun }
                    });
                }
            });
        }

        var overdraftEnabled = localStorage.getItem('savora_pref_overdraft') !== 'false';
        if (overdraftEnabled) {
            categories.forEach(function (c) {
                if (c.tipe === "Expense" && c.limitbulanan > 0) {
                    var spent = 0;
                    transactions.forEach(function (t) {
                        if (t.tipe === "Expense" && t.kategori === c.namakategori) spent += t.jumlah;
                    });
                    var id = 'over-' + c.namakategori;
                    if (spent >= c.limitbulanan && !isDismissed(id)) {
                        activeNotifications.push({
                            id: id,
                            type: 'overdraft',
                            title: "Limit Anggaran " + translateDbValue(c.namakategori) + " Terlampaui!",
                            message: "Total pengeluaran harian kategori " + translateDbValue(c.namakategori) + " mencapai " + formatMoney(spent) + " melebihi batas bulanan Anda (" + formatMoney(c.limitbulanan) + ").",
                            meta: { category: c.namakategori }
                        });
                    }
                }
            });
        }

        var checklistEnabled = localStorage.getItem('savora_pref_checklist') !== 'false';
        if (checklistEnabled) {
            var todayRealForNotif = new Date();
            var todayISOForNotif = (new Date(todayRealForNotif - todayRealForNotif.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
            var todayEv = calendarEventsData.find(function (e) { return e.tanggal === todayISOForNotif; });
            if (todayEv && todayEv.remindersJSON) {
                try {
                    var list = JSON.parse(todayEv.remindersJSON);

                    // SENSOR CERDAS: Kecualikan onboarding checklist bawaan dari alarm tagihan wajib
                    var pending = list.filter(function (r) {
                        return !r.done && !r.text.includes("🎯 Mulai catat transaksi pertama Anda di Savora");
                    });

                    var id = 'check-today';
                    if (pending.length > 0 && !isDismissed(id)) {
                        activeNotifications.push({
                            id: id,
                            type: 'checklist',
                            title: "Ada " + pending.length + " Tagihan Menunggu!",
                            message: "Anda memiliki " + pending.length + " agenda tagihan pending hari ini. Segera selesaikan sebelum denda.",
                            meta: { count: pending.length }
                        });
                    }
                } catch (e) { }
            }
        }

        var readList = JSON.parse(localStorage.getItem('savora_read_notifs')) || [];
        var unreadActiveCount = activeNotifications.filter(function (n) { return !readList.includes(n.id); }).length;

        var destBadge = document.getElementById('desktopNotifBadge');
        var mobBadge = document.getElementById('mobileNotifBadge');
        if (unreadActiveCount > 0) {
            if (destBadge) destBadge.classList.remove('hidden');
            if (mobBadge) mobBadge.classList.remove('hidden');
        } else {
            if (destBadge) destBadge.classList.add('hidden');
            if (mobBadge) mobBadge.classList.add('hidden');
        }

        var filterUnreadBadge = document.getElementById('unreadNotifCountBadge');
        if (filterUnreadBadge) {
            if (unreadActiveCount > 0) {
                filterUnreadBadge.innerText = unreadActiveCount;
                filterUnreadBadge.classList.remove('hidden');
            } else {
                filterUnreadBadge.classList.add('hidden');
            }
        }
    }

    function renderNotificationHistoryList() {

        if (!container) return;

        container.innerHTML = '';

        runActiveNotificationScan();

            displayActiveNotifs = displayActiveNotifs.filter(function (notif) { return !readList.includes(notif.id); });
        }

        var displayHistory = [].concat(notificationHistory);
        if (activeNotifFilter === 'unread') {
            displayHistory = [];
        }

        if (displayActiveNotifs.length === 0 && displayHistory.length === 0) {
            container.innerHTML = '<p class="text-center text-xs text-slate-400 py-12">' +
                (activeNotifFilter === 'unread' ? 'Tidak ada notifikasi baru yang belum dibaca.' : 'Belum ada riwayat notifikasi finansial harian.') +
                '</p>';
            return;
        }

        displayActiveNotifs.forEach(function (notif) {
            var icon = '<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>';
            var cardBg = 'bg-rose-500/5 border-rose-500/20';
            var btnLabel = 'Selesaikan';
            var btnAction = '';

            if (notif.type === 'critical') {
                icon = '<i class="fa-solid fa-circle-exclamation text-rose-500"></i>';
                cardBg = 'bg-red-500/5 border-red-500/20';
                btnLabel = 'Pindahkan Dana';
                btnAction = "executeActionableNotifCta('transfer')";

                icon = '<i class="fa-solid fa-circle-exclamation text-rose-500"></i>';
                cardBg = 'bg-rose-500/5 border-rose-500/20';
                btnLabel = 'Ubah Anggaran';
                btnAction = "executeActionableNotifCta('category')";
            } else if (notif.type === 'checklist') {
                icon = '<i class="fa-solid fa-calendar-check text-savora-orange"></i>';
                cardBg = 'bg-orange-500/5 border-orange-500/20';
                btnLabel = 'Buka Kalender';
                btnAction = "executeActionableNotifCta('calendar')";
            }

            var isHighlighted = (highlightedNotifId === notif.id);
            var highlightClass = isHighlighted ? 'animate-notif-flash border-savora-orange shadow-lg shadow-savora-orange/10' : '';
            var isRead = readList.includes(notif.id);
            var pulseIndicator = !isRead ? '<span class="inline-block w-2.5 h-2.5 rounded-full bg-[#F97316] animate-pulse"></span>' : '';

            var ctaButtonHtml = '';
            if (btnAction) {
                ctaButtonHtml = '<button onclick="event.stopPropagation(); markNotificationAsRead(\'' + notif.id + '\'); ' + btnAction + '" class="shrink-0 bg-slate-900 hover:bg-slate-800 text-white font-bold py-1.5 px-3 rounded-lg text-[10px] transition-all duration-150">' + btnLabel + '</button>';
            }

                '  <div class="flex gap-3 items-start min-w-0">' +
                '    <span class="w-8 h-8 rounded-xl bg-white flex items-center justify-center text-xs shrink-0">' + icon + '</span>' +
                '    <div class="min-w-0">' +
                '      <h4 class="font-extrabold text-xs text-rose-600 flex items-center gap-1.5">' +
                '        ' + pulseIndicator + '' +
                '        ' + notif.title + '' +
                '      </h4>' +
                '      <p class="text-[11px] text-slate-600 mt-1 leading-relaxed">' + notif.message + '</p>' +
                '    </div>' +
                '  </div>' +
                '  <div class="flex items-center gap-2 mt-2 sm:mt-0 self-end sm:self-auto">' +
                '    ' + ctaButtonHtml + '' +

    function handleSupportSubmit(event) {
        event.preventDefault();
        var payload = {
            nama: document.getElementById('supportFullName').value.trim(),
            email: document.getElementById('supportEmail').value.trim(),
            kendala: document.getElementById('supportProblemDesc').value.trim()
        };

        var btn = document.getElementById('btnSendSupportTicket');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Mengirim...';
        }

        showToast("Kirim Aduan...", "Menyimpan tiket bantuan ke cloud Savora...", "info");

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = currentLanguage === 'id' ? "Kirim Tiket Bantuan" : "Send Support Ticket";
                    }
                    if (response.success) {
                        triggerHaptic([100, 50, 100]);
                        showToast("Tiket Terkirim!", "ID Aduan Anda: " + response.ticketId + ". Cek email secara berkala.", "success");
                        document.getElementById('supportFormPanel').reset();

                        document.getElementById('supportTrackEmailInput').value = payload.email;
                        toggleSupportPanelMode();
                    } else {
                        showToast("Gagal", response.message, "error");
                    }
                })
                .withFailureHandler(function (e) {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = currentLanguage === 'id' ? "Kirim Tiket Bantuan" : "Send Support Ticket";
                    }
                    showToast("Error", e.toString(), "error");
                })
                .submitSupportTicket(payload);
        } else {
            setTimeout(function () {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = currentLanguage === 'id' ? "Kirim Tiket Bantuan" : "Send Support Ticket";
                }
                var mockId = "TKT-20260613-000" + (mockTicketsData.length + 1);
                mockTicketsData.unshift({
                    id: mockId,
                    tanggal: new Date().toLocaleString('id-ID'),
                    nama: payload.nama,
                    email: payload.email,
                    kendala: payload.kendala,
                    balasan: "Savora AI: Tiket simulasi offline disimpan di memori lokal.",
                    status: "Selesai"
                });
                document.getElementById('supportFormPanel').reset();
                showToast("Sukses Lokal", "Tiket " + mockId + " dibuat dalam mode simulasi offline.", "success");
                document.getElementById('supportTrackEmailInput').value = payload.email;
                toggleSupportPanelMode();
            }, 1000);
        }
    }

    function handleTrackTickets() {
        var emailInput = document.getElementById('supportTrackEmailInput');
        var email = emailInput ? emailInput.value.trim() : '';
        var container = document.getElementById('supportTrackResults');

        if (!container) return;
        if (!email) {
            container.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">Ketik email Anda di atas untuk memuat riwayat aduan.</p>';
            return;
        }

        container.innerHTML = '<div class="text-center py-6 text-xs text-slate-400"><i class="fa-solid fa-spinner animate-spin text-savora-orange"></i> Memproses mencari aduan...</div>';

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (tickets) {
                    renderTrackTicketsResults(tickets, container);
                })
                .withFailureHandler(function (err) {
                    container.innerHTML = '<p class="text-center text-xs text-rose-500 py-6">Gagal memuat: ' + err.toString() + '</p>';
                })
                .getTicketsByEmail(email);
        } else {
            setTimeout(function () {
                var filtered = mockTicketsData.filter(function (t) { return t.email.toLowerCase() === email.toLowerCase(); });
                renderTrackTicketsResults(filtered, container);
            }, 500);
        }
    }

    function renderTrackTicketsResults(tickets, container) {
        container.innerHTML = '';
        if (!tickets || tickets.length === 0) {
            container.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">Tidak ada tiket bantuan terdaftar untuk email ini.</p>';
            return;
        }

    function executeFactoryReset() {
        closeConfirmModal();
        showToast("Factory Reset...", "Mengosongkan memori penyimpanan harian...", "info");

        if (checkIsGAS() && navigator.onLine) {
            google.script.run
                .withSuccessHandler(function (response) {
                    if (response.success) {
                        // Bersihkan seluruh cache browser secara mutlak
                        localStorage.clear();
                        sessionStorage.clear();
                        triggerHaptic([200, 100, 200, 100, 500]);
                        showToast("Selesai", response.message, "success");
                        setTimeout(function () {
                            window.location.reload();
                        }, 1500);
                    } else {
                        showToast("Gagal Reset", response.message, "error");
                    }
                })
                .withFailureHandler(function (err) {
                    showToast("Error Reset", err.toString(), "error");
                })
                .clearDatabaseCloud();
        } else {
            setTimeout(function () {
                // Bersihkan seluruh cache browser secara mutlak untuk mode luring
                localStorage.clear();
                sessionStorage.clear();
                triggerHaptic([200, 100, 200, 100, 500]);
                showToast("Selesai", "Aplikasi lokal offline berhasil di-reset sepenuhnya. Memuat ulang...", "success");
                setTimeout(function () {
                    window.location.reload();
                }, 1500);
            }, 1200);
        }
    }

    var toastTimeout;
    function showToast(title, msg, type) {
        var toast = document.getElementById('toast');
        var tIcon = document.getElementById('toastIcon');
        var tTitle = document.getElementById('toastTitle');
        var tMsg = document.getElementById('toastMsg');

        if (!toast || !tIcon || !tTitle || !tMsg) return;

        clearTimeout(toastTimeout);

        tTitle.innerText = title;
        tMsg.innerText = msg;

        var borderClass = 'border-savora-800';
        var iconHtml = '<i class="fa-solid fa-bell"></i>';
        var iconBg = 'bg-savora-100 text-savora-800';

        if (type === 'success') {
            borderClass = 'border-emerald-500';
            iconHtml = '<i class="fa-solid fa-circle-check"></i>';
            iconBg = 'bg-emerald-50 text-emerald-500';
        } else if (type === 'error') {
            borderClass = 'border-rose-500';
            iconHtml = '<i class="fa-solid fa-circle-xmark"></i>';
            iconBg = 'bg-rose-50 text-rose-500';
        } else if (type === 'warning') {
            borderClass = 'border-amber-500';
            iconHtml = '<i class="fa-solid fa-circle-exclamation"></i>';
            iconBg = 'bg-amber-50 text-amber-500';
        }

        toast.className = "fixed top-4 right-4 z-[110] transition-all duration-300 max-w-sm w-full bg-white rounded-2xl shadow-2xl p-4 border-l-4 " + borderClass + " flex items-center gap-3 font-sans";
        tIcon.className = "p-2 " + iconBg + " rounded-xl";
        tIcon.innerHTML = iconHtml;

        toast.classList.remove('translate-y-[-120px]', 'opacity-0');

        toastTimeout = setTimeout(function () {
            hideToast();
        }, 4500);
    }

    function initDragToScroll() {
        var slider = document.getElementById('accountsSliderContainer');
        if (!slider) return;

        var isDown = false;
        var startX;
        var scrollLeft;

        slider.addEventListener('mousedown', function (e) {
            isDown = true;
            slider.classList.add('active');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
            isDraggingActive = false;
        });

        slider.addEventListener('mouseleave', function () {
            isDown = false;
            slider.classList.remove('active');
        });

        slider.addEventListener('mouseup', function () {
            isDown = false;
            slider.classList.remove('active');
        });

        slider.addEventListener('mousemove', function (e) {
            if (!isDown) return;
            e.preventDefault();
            var x = e.pageX - slider.offsetLeft;
            var walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
            isDraggingActive = true;
        });
    }

    function streamAiReply(cleanReply, activeList) {
        var container = document.getElementById('aiChatWindow');
        if (!container) return;

        var uniqueId = 'ai-stream-' + new Date().getTime();
        container.insertAdjacentHTML('beforeend',
            '<div class="flex gap-2 max-w-lg">' +
            '  <div class="w-8 h-8 rounded-full bg-savora-800 text-white flex items-center justify-center text-xs flex-shrink-0"><i class="fa-solid fa-robot text-savora-orange"></i></div>' +
            '  <div id="' + uniqueId + '" class="bg-white rounded-2xl px-4 py-2.5 text-sm shadow-sm text-slate-700 leading-relaxed font-sans">' +
            '  </div>' +
            '</div>'
        );

        var targetEl = document.getElementById(uniqueId);
        var currentLength = 0;
        var words = cleanReply.split(" ");

        function streamWord() {
            if (currentLength < words.length) {
                var partialText = words.slice(0, currentLength + 1).join(" ");
                targetEl.innerHTML = parseMarkdown(partialText);
                container.scrollTop = container.scrollHeight;
                currentLength++;
                setTimeout(streamWord, 35);
            } else {
                activeList.push({ sender: 'model', text: cleanReply });
                if (!checkIsGAS()) {
                    if (aiChatMode === 'consult') {
                        localStorage.setItem('savora_chat_consult', JSON.stringify(consultChatHistory));
                    } else {
                        localStorage.setItem('savora_chat_catat', JSON.stringify(catatChatHistory));
                    }
                }
                triggerHaptic(50);
                renderAiChatHistory();
            }
        }
        streamWord();
    }

    function exportToCSV() {
        triggerHaptic(20);
        if (transactions.length === 0) {
            showToast("Gagal", "Tidak ada transaksi untuk diekspor.", "warning");
            return;
        }

        var csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "ID,Tanggal,Tipe,Kategori,Jumlah,Deskripsi,Acc,TransferTo\n";

        transactions.forEach(function (t) {
            var escapedDesc = '"' + t.deskripsi.replace(/"/g, '""') + '"';
            var row = [
                t.id,
                t.tanggal,
                t.tipe,
                t.kategori,
                t.jumlah,
                escapedDesc,
                t.akun,
                t.transferke || ""
            ];
            csvContent += row.join(",") + "\n";
        });

        var encodedUri = encodeURI(csvContent);
        var link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Savora_Transactions_Export_" + new Date().toISOString().split('T')[0] + ".csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        triggerHaptic([100, 50, 100]);
        showToast("Sukses Export", "Data transaksi berhasil dikonversi ke file CSV!", "success");
    }
